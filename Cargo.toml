[package]
name = "testrail-arriba"
version = "1.0.0"
edition = "2024"
description = "TestRail CLI for plans, runs, cases, attachments, and step results written in Markdown with inline screenshots"
license = "MIT"
repository = "https://github.com/arriba-tools/testrail"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
dialoguer = "0.12"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
keyring-core = "1"
windows-native-keyring-store = "1"

[dev-dependencies]
mockito = "1"
tempfile = "3"
